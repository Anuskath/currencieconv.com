<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#533afd" />
      <stop offset="100%" stop-color="#665efd" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Deep Dark Slate Background Container -->
  <rect width="64" height="64" rx="16" fill="#090a0f" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#22284c" stroke-width="1.5" />

  <!-- Outer Interlocking Circular Exchange Rings -->
  <!-- Top Right Currency Arc with Arrow -->
  <path d="M22 17C28 13 41 14 47 23M47 23L47 16M47 23L40 22" stroke="url(#primaryGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bottom Left Currency Arc with Arrow -->
  <path d="M42 47C36 51 23 50 17 41M17 41L17 48M17 41L24 42" stroke="#f96bee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Floating Gold/Amber Coin Badge -->
  <circle cx="32" cy="32" r="10.5" fill="#181d38" stroke="#384277" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="32" y="37" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">₹</text>
</svg>
